<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negotia — 1-on-1 Freelance Job Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            canvas: 'hsl(220 23% 98%)',
            surface: 'hsl(0 0% 100%)',
            inset: 'hsl(220 18% 94%)',
            'border-subtle': 'hsl(220 16% 90%)',
            'txt-primary': 'hsl(224 28% 14%)',
            'txt-secondary': 'hsl(220 12% 37%)',
            'txt-tertiary': 'hsl(220 10% 50%)',
            accent: { 50:'hsl(230 100% 98%)', 100:'hsl(228 100% 96%)', 500:'hsl(231 85% 63%)', 600:'hsl(233 74% 57%)', 700:'hsl(235 69% 50%)' },
            success: { 50:'hsl(145 64% 96%)', 500:'hsl(142 71% 45%)', 600:'hsl(142 72% 35%)' },
            warning: { 50:'hsl(48 100% 96%)', 500:'hsl(38 92% 50%)' },
            danger: { 50:'hsl(0 86% 97%)', 500:'hsl(0 84% 60%)', 600:'hsl(0 72% 51%)' },
          }
        }
      }
    }
  </script>
  <style>
    body { background: hsl(220 23% 98%); font-family: 'Inter', system-ui, sans-serif; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-pulse { animation: pulse 2s ease-in-out infinite; }
    .shadow-soft { box-shadow: 0 1px 2px hsla(224,30%,10%,0.06), 0 8px 20px hsla(224,30%,10%,0.04); }
    .shadow-medium { box-shadow: 0 2px 6px hsla(224,30%,10%,0.08), 0 12px 28px hsla(224,30%,10%,0.06); }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>
  <script>
    const MOCK_JOBS = [
      { id:'j1', title:'Design a mobile onboarding flow', description:'Create 4–5 screen mobile onboarding flow with illustrations, progress indicators, and a final CTA. Figma handoff included.', budgetCents:180000, status:'OPEN', createdAt: new Date(Date.now()-3600000).toISOString() },
      { id:'j2', title:'Build a REST API for a booking system', description:'Node.js/Express REST API for appointment booking. Features: user auth, availability slots, booking CRUD, email notifications.', budgetCents:320000, status:'OPEN', createdAt: new Date(Date.now()-7200000).toISOString() },
      { id:'j3', title:'Refactor jQuery dashboard to React', description:'Migrate legacy jQuery-based admin dashboard to React 18 with TypeScript. ~15 pages, data tables, charts.', budgetCents:540000, status:'OCCUPIED', createdAt: new Date(Date.now()-86400000).toISOString() },
      { id:'j4', title:'Write technical documentation for API', description:'Comprehensive API documentation with examples, error codes, authentication guides. OpenAPI/Swagger format.', budgetCents:95000, status:'OPEN', createdAt: new Date(Date.now()-1800000).toISOString() },
      { id:'j5', title:'Set up CI/CD pipeline with GitHub Actions', description:'Configure automated testing, building, and deployment pipeline. Docker containerization.', budgetCents:150000, status:'CLOSED', createdAt: new Date(Date.now()-172800000).toISOString() },
      { id:'j6', title:'Design brand identity for SaaS startup', description:'Logo design, color palette, typography system, and brand guidelines document.', budgetCents:250000, status:'OPEN', createdAt: new Date(Date.now()-5400000).toISOString() },
    ];

    const MOCK_MESSAGES = [
      { id:'m1', sender:'Sam (Freelancer)', mine:false, body:'Hi! I saw your job post for the React migration. I have 5 years of experience with React.', createdAt: new Date(Date.now()-300000).toISOString() },
      { id:'m2', sender:'Ava (Client)', mine:true, body:'Great! Can you tell me about your approach? We have about 15 pages.', createdAt: new Date(Date.now()-240000).toISOString() },
      { id:'m3', sender:'Sam (Freelancer)', mine:false, body:'I would start with the core layout and auth, then migrate page by page. Each table gets its own component.', createdAt: new Date(Date.now()-180000).toISOString() },
      { id:'m4', sender:'Ava (Client)', mine:true, body:'That sounds like a solid plan. What about the charts?', createdAt: new Date(Date.now()-120000).toISOString() },
    ];

    let currentUser = null;
    let currentPage = 'login';
    let activeJobId = null;

    function formatBudget(cents) {
      return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', minimumFractionDigits:0 }).format(cents/100);
    }
    function timeAgo(d) {
      const m = Math.floor((Date.now()-new Date(d).getTime())/60000);
      if(m<1) return 'just now'; if(m<60) return m+'m ago';
      const h=Math.floor(m/60); if(h<24) return h+'h ago';
      return Math.floor(h/24)+'d ago';
    }

    function render() {
      const app = document.getElementById('app');
      if(currentPage==='login') app.innerHTML = renderLogin();
      else if(currentPage==='board') app.innerHTML = renderBoard();
      else if(currentPage==='chat') app.innerHTML = renderChat();
      else if(currentPage==='post') app.innerHTML = renderPost();
      bindEvents();
    }

    function renderLogin() {
      return `
        <div class="flex min-h-screen items-center justify-center px-4">
          <div class="w-full max-w-sm">
            <div class="mb-8 text-center">
              <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-accent-600 text-white shadow-medium">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              </div>
              <h1 class="text-xl font-semibold text-txt-primary">Negotia</h1>
              <p class="mt-1 text-sm text-txt-secondary">1-on-1 Freelance Job Board</p>
            </div>
            <div class="space-y-4 rounded-2xl border border-border-subtle bg-surface p-6 shadow-soft">
              <div>
                <label class="mb-1.5 block text-sm font-medium text-txt-primary">Email</label>
                <input id="email" type="email" value="freelancer@demo.dev" class="w-full rounded-lg border border-border-subtle bg-surface px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/30"/>
              </div>
              <div>
                <label class="mb-1.5 block text-sm font-medium text-txt-primary">Password</label>
                <input id="password" type="password" value="password123" class="w-full rounded-lg border border-border-subtle bg-surface px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/30"/>
              </div>
              <button id="loginBtn" class="w-full rounded-lg bg-accent-600 py-2.5 text-sm font-medium text-white hover:bg-accent-700 transition">Sign in</button>
            </div>
            <div class="mt-6">
              <p class="mb-3 text-center text-xs text-txt-tertiary">Quick login (demo accounts)</p>
              <div class="grid grid-cols-3 gap-2">
                <button onclick="quickLogin('client')" class="rounded-lg border border-accent-200 bg-accent-50 px-3 py-2 text-xs font-medium text-accent-700 hover:bg-accent-100 transition">Client</button>
                <button onclick="quickLogin('freelancer')" class="rounded-lg border border-success-500/20 bg-success-50 px-3 py-2 text-xs font-medium text-success-600 hover:bg-success-500/10 transition">Sam</button>
                <button onclick="quickLogin('jordan')" class="rounded-lg border border-success-500/20 bg-success-50 px-3 py-2 text-xs font-medium text-success-600 hover:bg-success-500/10 transition">Jordan</button>
              </div>
            </div>
          </div>
        </div>`;
    }

    function renderBoard() {
      const isClient = currentUser?.role === 'CLIENT';
      const jobs = isClient ? MOCK_JOBS : MOCK_JOBS.filter(j=>j.status!=='CLOSED');
      return `
        <header class="sticky top-0 z-50 border-b border-border-subtle bg-surface/80 backdrop-blur-md">
          <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4">
            <div class="flex items-center gap-2 font-semibold text-txt-primary">
              <svg class="h-5 w-5 text-accent-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              <span class="text-lg tracking-tight">Negotia</span>
            </div>
            <div class="flex items-center gap-4">
              ${isClient ? '<button onclick="currentPage=\'post\';render()" class="rounded-md bg-accent-600 px-3.5 py-1.5 text-sm font-medium text-white shadow-soft hover:bg-accent-700 transition">Post Job</button>' : ''}
              <span class="text-sm text-txt-secondary">${currentUser?.name}</span>
              <span class="rounded-full bg-accent-50 px-2 py-0.5 text-xs font-medium text-accent-700">${currentUser?.role}</span>
              <button onclick="currentUser=null;currentPage=\'login\';render()" class="rounded-md p-1.5 text-txt-tertiary hover:bg-inset hover:text-txt-primary transition">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              </button>
            </div>
          </div>
        </header>
        ${activeJobId ? `
        <div class="sticky top-14 z-40 border-b border-success-500/20 bg-success-50 px-4 py-2">
          <div class="mx-auto flex max-w-6xl items-center justify-between">
            <div class="flex items-center gap-2 text-sm font-medium text-success-600">
              <span class="inline-block h-2 w-2 rounded-full bg-success-500 animate-pulse"></span>
              Status: 1 Project in Negotiation Stage
            </div>
            <button onclick="currentPage='chat';render()" class="rounded-md bg-success-600 px-3 py-1 text-xs font-medium text-white hover:bg-success-600/90 transition">Return to negotiation</button>
          </div>
        </div>` : ''}
        <main class="mx-auto max-w-6xl px-4 py-6">
          <div class="mb-6">
            <h1 class="text-2xl font-semibold text-txt-primary tracking-tight">${isClient ? 'Your Jobs' : 'Available Jobs'}</h1>
            <p class="mt-1 text-sm text-txt-secondary">${isClient ? 'Jobs you have posted — wait for a freelancer to lock one' : 'Click a job to lock it and start a 1-on-1 negotiation'}</p>
          </div>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            ${jobs.map(j => renderJobCard(j)).join('')}
          </div>
        </main>`;
    }

    function renderJobCard(j) {
      const isMyJob = j.status==='OCCUPIED' && j.id===activeJobId;
      const occupied = j.status==='OCCUPIED' && !isMyJob;
      const closed = j.status==='CLOSED';
      const blocked = activeJobId && activeJobId!==j.id;
      const clickable = ((j.status==='OPEN' && !blocked) || isMyJob);
      const borderClass = clickable ? 'border-border-subtle shadow-soft hover:shadow-medium hover:border-accent-200 cursor-pointer' : isMyJob ? 'border-success-500/40 shadow-medium ring-2 ring-success-500/20 cursor-pointer' : 'border-border-subtle opacity-60';

      return `
        <div class="group relative flex flex-col overflow-hidden rounded-xl border bg-surface transition-all duration-200 ${borderClass}"
             onclick="${clickable ? `lockJob('${j.id}')` : ''}">
          <div class="flex flex-1 flex-col p-4">
            <div class="mb-2 flex items-start justify-between gap-2">
              <h3 class="text-sm font-semibold text-txt-primary leading-snug line-clamp-2">${j.title}</h3>
              <span class="shrink-0 rounded-md bg-accent-50 px-2 py-0.5 text-xs font-semibold text-accent-700">${formatBudget(j.budgetCents)}</span>
            </div>
            <p class="mb-3 text-xs text-txt-secondary line-clamp-2 leading-relaxed">${j.description}</p>
            <div class="mt-auto flex items-center gap-3 text-xs text-txt-tertiary">
              <span class="flex items-center gap-1">
                <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                ${timeAgo(j.createdAt)}
              </span>
              <span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium ${j.status==='OPEN'?'bg-success-50 text-success-600':j.status==='OCCUPIED'?'bg-warning-50 text-warning-600':'bg-inset text-txt-tertiary'}">
                ${j.status==='OPEN'?'Available':j.status==='OCCUPIED'?(isMyJob?'Your negotiation':'Occupied'):'Filled'}
              </span>
            </div>
          </div>
          ${occupied ? `<div class="absolute inset-0 flex items-center justify-center rounded-xl bg-txt-primary/5 backdrop-blur-[1px]"><div class="flex items-center gap-2 rounded-lg bg-surface/90 px-3 py-2 text-sm font-medium text-txt-secondary shadow-medium"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Occupied — in negotiation</div></div>` : ''}
          ${isMyJob ? `<div class="absolute inset-0 flex items-center justify-center rounded-xl bg-success-500/5"><div class="flex items-center gap-2 rounded-lg bg-surface/90 px-3 py-2 text-sm font-medium text-success-600 shadow-medium"><span class="h-2 w-2 rounded-full bg-success-500 animate-pulse"></span>Your negotiation — tap to resume</div></div>` : ''}
          ${closed ? `<div class="absolute inset-0 flex items-center justify-center rounded-xl bg-txt-primary/5"><div class="rounded-lg bg-surface/90 px-3 py-2 text-sm font-medium text-txt-tertiary shadow-medium">Filled</div></div>` : ''}
          ${blocked && j.status==='OPEN' ? `<div class="absolute inset-0 flex items-center justify-center rounded-xl bg-canvas/80 backdrop-blur-[1px]"><div class="rounded-lg bg-surface/90 px-3 py-2 text-sm font-medium text-txt-tertiary shadow-medium text-center">Finish your current<br>negotiation first</div></div>` : ''}
        </div>`;
    }

    function renderChat() {
      return `
        <div class="flex h-screen flex-col">
          <div class="border-b border-border-subtle bg-surface px-4 py-3">
            <div class="mx-auto flex max-w-3xl items-center justify-between">
              <div>
                <h2 class="text-sm font-semibold text-txt-primary">Refactor jQuery dashboard to React</h2>
                <p class="text-xs text-txt-secondary">Negotiating with ${currentUser?.role==='CLIENT'?'freelancer':'Ava (Client)'} · <span class="font-medium text-accent-600">${formatBudget(540000)}</span></p>
              </div>
              <button onclick="currentPage='board';render()" class="text-xs text-txt-tertiary hover:text-txt-primary transition">← Back to board</button>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto px-4 py-4">
            <div class="mx-auto max-w-3xl space-y-3">
              ${MOCK_MESSAGES.map(m => `
                <div class="flex ${m.mine?'justify-end':'justify-start'}">
                  <div class="max-w-[80%] rounded-xl px-3.5 py-2.5 ${m.mine?'bg-accent-600 text-white rounded-br-sm':'bg-surface border border-border-subtle text-txt-primary rounded-bl-sm'}">
                    ${!m.mine ? `<p class="mb-0.5 text-xs font-medium text-accent-600">${m.sender}</p>` : ''}
                    <p class="text-sm leading-relaxed">${m.body}</p>
                    <p class="mt-1 text-[10px] ${m.mine?'text-white/60':'text-txt-tertiary'}">${new Date(m.createdAt).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}</p>
                  </div>
                </div>`).join('')}
            </div>
          </div>
          ${currentUser?.role==='FREELANCER' ? `
          <div class="border-t border-border-subtle bg-surface px-4 py-3">
            <div class="mx-auto max-w-3xl">
              <div class="mb-3 flex items-center gap-2">
                <button onclick="currentPage='board';activeJobId=null;render()" class="flex items-center gap-1.5 rounded-lg border border-danger-500/30 bg-danger-50 px-3.5 py-2 text-sm font-medium text-danger-600 hover:bg-danger-100 transition">
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                  Decline
                </button>
                <button onclick="showAgreement()" class="flex items-center gap-1.5 rounded-lg bg-success-600 px-3.5 py-2 text-sm font-medium text-white hover:bg-success-600/90 shadow-soft transition">
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                  Accept
                </button>
              </div>
              <div class="flex items-center gap-2">
                <input id="chatInput" type="text" placeholder="Type a message…" class="flex-1 rounded-lg border border-border-subtle bg-surface px-3.5 py-2.5 text-sm text-txt-primary placeholder:text-txt-tertiary focus:border-accent-500 focus:ring-2 focus:ring-accent-500/20 focus:outline-none"/>
                <button class="rounded-lg bg-accent-600 p-2.5 text-white hover:bg-accent-700 transition">
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
                </button>
              </div>
            </div>
          </div>` : `
          <div class="border-t border-border-subtle bg-surface px-4 py-3">
            <div class="mx-auto max-w-3xl flex items-center gap-2">
              <input id="chatInput" type="text" placeholder="Type a message…" class="flex-1 rounded-lg border border-border-subtle bg-surface px-3.5 py-2.5 text-sm text-txt-primary placeholder:text-txt-tertiary focus:border-accent-500 focus:ring-2 focus:ring-accent-500/20 focus:outline-none"/>
              <button class="rounded-lg bg-accent-600 p-2.5 text-white hover:bg-accent-700 transition">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
              </button>
            </div>
          </div>`}
        </div>`;
    }

    function renderPost() {
      return `
        <header class="sticky top-0 z-50 border-b border-border-subtle bg-surface/80 backdrop-blur-md">
          <div class="mx-auto flex h-14 max-w-6xl items-center justify-between px-4">
            <div class="flex items-center gap-2 font-semibold text-txt-primary">
              <svg class="h-5 w-5 text-accent-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              <span class="text-lg tracking-tight">Negotia</span>
            </div>
            <button onclick="currentPage='board';render()" class="text-sm text-txt-secondary hover:text-txt-primary transition">← Back</button>
          </div>
        </header>
        <main class="mx-auto max-w-2xl px-4 py-8">
          <div class="mb-6 flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-accent-50 text-accent-600">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            </div>
            <div>
              <h1 class="text-xl font-semibold text-txt-primary">Post a New Job</h1>
              <p class="text-sm text-txt-secondary">Fill in the details below. Agreement text is mandatory.</p>
            </div>
          </div>
          <div class="space-y-5 rounded-2xl border border-border-subtle bg-surface p-6 shadow-soft">
            <div>
              <label class="mb-1.5 block text-sm font-medium text-txt-primary">Job Title</label>
              <input type="text" placeholder="e.g. Design a mobile onboarding flow" class="w-full rounded-lg border border-border-subtle bg-surface px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/30"/>
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-txt-primary">Description</label>
              <textarea rows="5" placeholder="Describe the project scope, requirements, and deliverables…" class="w-full rounded-lg border border-border-subtle bg-surface px-3.5 py-2.5 text-sm resize-y focus:outline-none focus:ring-2 focus:ring-accent-500/30"></textarea>
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-txt-primary">Budget (USD)</label>
              <div class="relative">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-txt-tertiary">$</span>
                <input type="number" placeholder="0" class="w-full rounded-lg border border-border-subtle bg-surface pl-7 pr-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-accent-500/30"/>
              </div>
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-medium text-txt-primary">Agreement Text <span class="text-danger-500">*</span></label>
              <p class="mb-2 text-xs text-txt-tertiary">This text will be shown to the freelancer when they accept. They must sign it to close the deal.</p>
              <textarea rows="6" placeholder="Payment on delivery. 2 revisions included. NDA required. Timeline: 14 days…" class="w-full rounded-lg border border-border-subtle bg-surface px-3.5 py-2.5 text-sm resize-y focus:outline-none focus:ring-2 focus:ring-accent-500/30"></textarea>
            </div>
            <button onclick="currentPage='board';render()" class="w-full rounded-lg bg-accent-600 py-2.5 text-sm font-medium text-white hover:bg-accent-700 transition">Post Job</button>
          </div>
        </main>`;
    }

    function showAgreement() {
      const modal = document.createElement('div');
      modal.id = 'agreementModal';
      modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-txt-primary/40 backdrop-blur-sm p-4';
      modal.innerHTML = `
        <div class="flex w-full max-w-lg flex-col rounded-2xl bg-surface shadow-medium border border-border-subtle max-h-[85vh]">
          <div class="flex items-center justify-between border-b border-border-subtle px-5 py-4">
            <div>
              <h3 class="text-base font-semibold text-txt-primary">Agreement Terms</h3>
              <p class="text-xs text-txt-secondary mt-0.5">Refactor jQuery dashboard to React</p>
            </div>
            <button onclick="document.getElementById('agreementModal').remove()" class="rounded-lg p-1.5 text-txt-tertiary hover:bg-inset hover:text-txt-primary transition">
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <div class="flex-1 overflow-y-auto px-5 py-4">
            <div class="whitespace-pre-wrap text-sm leading-relaxed text-txt-secondary">Payment on delivery. 2 revision rounds included. NDA required before project start. Timeline: 14 calendar days from kickoff. All source files transferred upon final payment. Late delivery penalty: 5% per day after deadline. Code reviews required at each phase boundary. 10% holdback until UAT sign-off.</div>
          </div>
          <div class="border-t border-border-subtle px-5 py-4">
            <label class="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" id="agreeCheck" class="mt-0.5 h-4 w-4 rounded border-border-subtle text-accent-600"/>
              <span class="text-sm text-txt-secondary">I have read and agree to these terms. This signature is legally binding.</span>
            </label>
            <div class="mt-4 flex items-center justify-end gap-2">
              <button onclick="document.getElementById('agreementModal').remove()" class="rounded-lg border border-border-subtle bg-surface px-4 py-2 text-sm font-medium text-txt-secondary hover:bg-inset transition">Go back</button>
              <button onclick="activeJobId=null;currentPage='board';document.getElementById('agreementModal').remove();render()" class="flex items-center gap-1.5 rounded-lg bg-success-600 px-4 py-2 text-sm font-medium text-white hover:bg-success-600/90 shadow-soft transition">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                Sign &amp; Confirm
              </button>
            </div>
          </div>
        </div>`;
      document.body.appendChild(modal);
    }

    function quickLogin(role) {
      if(role==='client') { currentUser = {id:'c1',name:'Ava (Client)',email:'client@demo.dev',role:'CLIENT'}; }
      else if(role==='freelancer') { currentUser = {id:'f1',name:'Sam (Freelancer)',email:'freelancer@demo.dev',role:'FREELANCER'}; }
      else { currentUser = {id:'f2',name:'Jordan (Freelancer)',email:'jordan@demo.dev',role:'FREELANCER'}; }
      currentPage = 'board';
      render();
    }

    function lockJob(jobId) {
      const job = MOCK_JOBS.find(j=>j.id===jobId);
      if(!job || job.status!=='OPEN') return;
      if(activeJobId && activeJobId!==jobId) return;
      if(job.status==='OCCUPIED' && job.id===activeJobId) { currentPage='chat'; render(); return; }
      job.status = 'OCCUPIED';
      activeJobId = jobId;
      currentPage = 'chat';
      render();
    }

    function bindEvents() {
      const loginBtn = document.getElementById('loginBtn');
      if(loginBtn) loginBtn.onclick = () => quickLogin('freelancer');
      const chatInput = document.getElementById('chatInput');
      if(chatInput) chatInput.onkeydown = (e) => {
        if(e.key==='Enter' && chatInput.value.trim()) {
          MOCK_MESSAGES.push({id:'m'+Date.now(), sender:currentUser?.name, mine:true, body:chatInput.value.trim(), createdAt:new Date().toISOString()});
          chatInput.value = '';
          render();
          setTimeout(()=>document.querySelector('.overflow-y-auto').scrollTop=999999, 50);
        }
      };
    }

    render();
  </script>
</body>
</html>
